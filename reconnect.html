<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect & Feedback | Conference</title>
    <!-- Tailwind CSS CDN for rapid, clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .star-rating input {
            display: none;
        }
        .star-rating label {
            cursor: pointer;
            color: #d1d5db;
            transition: color 0.2s;
        }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #f59e0b;
        }
        /* Reverse layout to make hover work properly from left to right */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }
        .star-rating input:checked + label,
        .star-rating input:checked + label ~ label {
            color: #f59e0b;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Background Glow Effects -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Main Content Container -->
    <main class="relative z-10 max-w-md w-full mx-auto px-6 py-12 flex flex-col items-center justify-center flex-grow">
        
        <!-- Profile / Header Section -->
        <div class="text-center mb-8">
            <div class="w-24 h-24 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-full mx-auto flex items-center justify-center text-3xl font-bold shadow-lg shadow-blue-500/30 mb-4 border-2 border-slate-700">
                AP
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Thanks for connecting!</h1>
            <p class="text-slate-400 text-sm mt-1">Great meeting you at the conference. Let's stay in touch.</p>
        </div>

        <!-- Action Links Card -->
        <div class="w-full space-y-4">
            
            <!-- Reconnect Email Link -->
            <a href="mailto:ajpal@utmb.edu?subject=Reconnect%20after%20conference" 
               class="w-full flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 rounded-xl shadow-md transition-all duration-200 group hover:border-blue-500/50 hover:scale-[1.02]">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-colors">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="font-semibold text-sm text-slate-200">Email to Reconnect</h2>
                        <p class="text-xs text-slate-400">ajpal@utmb.edu</p>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-blue-400 transition-colors"></i>
            </a>

            <!-- Suggestion and Feedback Modal Trigger -->
            <button onclick="openModal()" 
                    class="w-full flex items-center justify-between p-4 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 rounded-xl shadow-md transition-all duration-200 group hover:border-indigo-500/50 hover:scale-[1.02]">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="font-semibold text-sm text-slate-200">Feedback & Suggestions</h2>
                        <p class="text-xs text-slate-400">Design, data, presentation & more</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-indigo-400 transition-colors text-xs"></i>
            </button>

        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 text-center py-6 text-xs text-slate-500">
        &copy; 2026 AJ Pal &bull; UTMB
    </footer>

    <!-- Feedback Modal (Anonymous / No Login Required) -->
    <div id="feedbackModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            
            <!-- Close Button -->
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="mb-6">
                <h3 class="text-xl font-bold text-white">Session Feedback</h3>
                <p class="text-xs text-slate-400 mt-1">No sign-in required. All fields are completely optional.</p>
            </div>

            <!-- Form connected to Google Forms backend action if desired, or handled via standard submission -->
            <!-- Note: To link directly to your Google Form url instead of inline popup, change this to an anchor link. If you prefer the inline modal submitting smoothly, you can point it to a Google Form action endpoint or keep it as a clean local form popup -->
            <form id="feedbackForm" onsubmit="submitForm(event)" class="space-y-4">
                
                <!-- General Rating -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Overall Rating</label>
                    <div class="star-rating text-2xl inline-flex">
                        <input type="radio" id="star5" name="rating" value="5"><label for="star5" title="5 stars"><i class="fa-solid fa-star"></i></label>
                        <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4 stars"><i class="fa-solid fa-star"></i></label>
                        <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3 stars"><i class="fa-solid fa-star"></i></label>
                        <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2 stars"><i class="fa-solid fa-star"></i></label>
                        <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1 star"><i class="fa-solid fa-star"></i></label>
                    </div>
                </div>

                <!-- Aspect evaluations (Design, Data, Presentation) -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Design</label>
                        <select name="design_score" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="">Select (1-5)</option>
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Very Good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Fair</option>
                            <option value="1">1 - Poor</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Data</label>
                        <select name="data_score" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="">Select (1-5)</option>
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Very Good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Fair</option>
                            <option value="1">1 - Poor</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Presentation</label>
                        <select name="presentation_score" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="">Select (1-5)</option>
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Very Good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Fair</option>
                            <option value="1">1 - Poor</option>
                        </select>
                    </div>
                </div>

                <!-- Text Box for Suggestions -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Comments, Suggestions or Feedback</label>
                    <textarea name="feedback_text" rows="3" placeholder="Share your thoughts here..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500 resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg shadow-md transition-colors">
                        Submit Feedback anonymously
                    </button>
                </div>
            </form>

            <!-- Success message state (hidden initially) -->
            <div id="successState" class="hidden text-center py-8">
                <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h4 class="font-bold text-white text-base">Thank you!</h4>
                <p class="text-xs text-slate-400 mt-1">Your feedback has been received anonymously.</p>
                <button onclick="closeModal()" class="mt-5 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs text-white rounded-lg">Close window</button>
            </div>

        </div>
    </div>

    <!-- Script to handle modal behavior -->
    <script>
        function openModal() {
            document.getElementById('feedbackModal').classList.remove('hidden');
            document.getElementById('feedbackModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('feedbackModal').classList.remove('flex');
            document.getElementById('feedbackModal').classList.add('hidden');
            // reset form state if needed
            document.getElementById('feedbackForm').reset();
            document.getElementById('feedbackForm').classList.remove('hidden');
            document.getElementById('successState').classList.add('hidden');
        }

        function submitForm(e) {
            e.preventDefault();
            // If you want to connect this directly to your target Google Form endpoint without login requirements, 
            // you can map the input names to standard Google Form entry IDs (`entry.XXXXXX`).
            // For now, this gives an instant polished UI confirmation screen.
            document.getElementById('feedbackForm').classList.add('hidden');
            document.getElementById('successState').classList.remove('hidden');
        }
    </script>
</body>
</html>
